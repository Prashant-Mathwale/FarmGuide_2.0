services:
  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      ML_SERVICE_URL: http://ml:8000
    depends_on:
      - ml

  ml:
    build: ./ml
    ports:
      - "8000:8000"
